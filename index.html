<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiscalización & Cómputos CTERA 2026 - UEPC Calamuchita</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #174276;
        --primary-dark: #0f2c52;
        --cv-purple: #5c3b93;
        --mc-red: #dc3545;
        --ab-blue: #0d6efd;
        --accent-green: #198754;
        --bg-page: #f0f4f8;
        --card-bg: #ffffff;
        --border: #dbe2ea;
        --text-muted: #6c757d;
        --text-dark: #212529;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Roboto", sans-serif;
      }
      body {
        background-color: var(--bg-page);
        color: var(--text-dark);
        padding-bottom: 80px;
      }

      .navbar {
        background-color: var(--primary);
        color: white;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      }
      .nav-title {
        font-weight: 700;
        font-size: 1.05rem;
      }
      .nav-badge {
        background: var(--cv-purple);
        color: white;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .sync-status {
        font-size: 0.72rem;
        color: #94a3b8;
        margin-left: 8px;
      }

      .tab-bar {
        display: flex;
        background: white;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 52px;
        z-index: 999;
      }
      .tab-btn {
        flex: 1;
        padding: 12px 4px;
        text-align: center;
        background: none;
        border: none;
        font-weight: 700;
        font-size: 0.82rem;
        color: var(--text-muted);
        cursor: pointer;
        border-bottom: 3px solid transparent;
        text-transform: uppercase;
      }
      .tab-btn.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
      }

      .container {
        max-width: 650px;
        margin: 14px auto;
        padding: 0 12px;
      }

      .card {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border);
      }

      .search-box {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid #cbd5e1;
        border-radius: 10px;
        font-size: 1rem;
        margin-bottom: 10px;
        font-weight: 500;
      }
      .search-box:focus {
        outline: none;
        border-color: var(--primary);
      }

      .filters-row {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .filter-btn {
        padding: 6px 10px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: white;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        white-space: nowrap;
      }
      .filter-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .voter-item {
        background: white;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background 0.2s;
      }
      .voter-item.voted {
        background: #f0fdf4;
        border-color: #86efac;
      }
      .voter-info {
        flex: 1;
        margin-right: 10px;
      }
      .voter-name {
        font-weight: 700;
        font-size: 0.95rem;
        color: #1e293b;
        margin-bottom: 3px;
      }
      .voter-meta {
        font-size: 0.8rem;
        color: #64748b;
      }

      .voter-actions {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .btn-voto {
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .btn-voto.voto-si {
        background: #16a34a;
        color: white;
        border-color: #16a34a;
      }

      .estimacion-select {
        font-size: 0.75rem;
        padding: 4px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        font-weight: 700;
        background: #ffffff;
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 14px;
      }
      .kpi-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 4px;
        text-align: center;
      }
      .kpi-card .num {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--primary);
      }
      .kpi-card .lbl {
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
      }

      .form-group {
        margin-bottom: 14px;
      }
      .form-group label {
        display: block;
        font-weight: 700;
        font-size: 0.85rem;
        color: #334155;
        margin-bottom: 5px;
      }
      .form-control {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 1rem;
      }
      .btn-submit {
        width: 100%;
        padding: 14px;
        background: var(--primary);
        color: white;
        font-weight: 700;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn-submit:hover {
        background: var(--primary-dark);
      }

      .table-results {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .table-results th,
      .table-results td {
        padding: 8px 10px;
        font-size: 0.85rem;
        text-align: center;
      }
      .table-results th {
        background: #174276;
        color: white;
        text-align: left;
      }
      .table-results td:first-child {
        text-align: left;
      }
      .table-results td {
        border-bottom: 1px solid #edf2f7;
      }
      .table-results tr:last-child td {
        border-bottom: none;
        font-weight: 700;
        background: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-title">
        🗳️ CTERA 2026 - Calamuchita
        <span id="sync-msg" class="sync-status">🟢 Conectado</span>
      </div>
      <div class="nav-badge">🟣 Celeste Violeta</div>
    </nav>

    <div class="tab-bar">
      <button
        class="tab-btn active"
        id="tab-padron"
        onclick="showTab('padron')"
      >
        📋 Padrón (920)
      </button>
      <button class="tab-btn" id="tab-cortes" onclick="showTab('cortes')">
        ⏰ Cortes (11h/15h)
      </button>
      <button class="tab-btn" id="tab-computos" onclick="showTab('computos')">
        📊 Cómputos
      </button>
    </div>

    <div class="container">
      <div id="view-padron">
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="num" id="kpi-padron-total">920</div>
            <div class="lbl">Padrón Total</div>
          </div>
          <div class="kpi-card">
            <div class="num" id="kpi-padron-votaron" style="color: #16a34a">
              0
            </div>
            <div class="lbl">Votaron</div>
          </div>
          <div class="kpi-card">
            <div class="num" id="kpi-padron-cv" style="color: var(--cv-purple)">
              0
            </div>
            <div class="lbl">Estimado CV</div>
          </div>
        </div>

        <input
          type="text"
          id="padron-search"
          class="search-box"
          placeholder="🔍 Buscar por Apellido, Nombre o DNI..."
          oninput="filterPadron()"
        />

        <div class="filters-row">
          <button
            class="filter-btn active"
            onclick="setMesaFilter('ALL', this)"
          >
            Todas (920)
          </button>
          <button class="filter-btn" onclick="setMesaFilter(1, this)">
            Mesa 1 (65)
          </button>
          <button class="filter-btn" onclick="setMesaFilter(2, this)">
            Mesa 2 (216)
          </button>
          <button class="filter-btn" onclick="setMesaFilter(3, this)">
            Mesa 3 (578)
          </button>
          <button class="filter-btn" onclick="setMesaFilter(4, this)">
            Mesa 4 (61)
          </button>
        </div>

        <div id="voter-list-container"></div>
      </div>

      <div id="view-cortes" style="display: none">
        <div class="card">
          <h3 style="color: var(--primary); margin-bottom: 8px">
            ⏰ Reporte de Corte Parcial
          </h3>
          <div class="form-group">
            <label>MESA</label>
            <select class="form-control" id="corte-mesa">
              <option value="1">Mesa 1 - La Cruz</option>
              <option value="2">Mesa 2 - Embalse</option>
              <option value="3" selected>
                Mesa 3 - Santa Rosa de Calamuchita
              </option>
              <option value="4">Mesa 4 - San Agustín</option>
            </select>
          </div>
          <div class="form-group">
            <label>HORARIO DE CORTE</label>
            <select class="form-control" id="corte-tipo">
              <option value="11:00 hs">1er Corte - 11:00 hs (Mediodía)</option>
              <option value="15:00 hs">2do Corte - 15:00 hs (Tarde)</option>
              <option value="18:00 hs">Cierre de Votación - 18:00 hs</option>
            </select>
          </div>
          <div class="form-group">
            <label>CANTIDAD DE VOTANTES QUE EMITIERON SU VOTO</label>
            <input
              type="number"
              class="form-control"
              id="corte-total-votaron"
              placeholder="Ej: 85"
              min="0"
            />
          </div>
          <div class="form-group">
            <label>ESTIMACIÓN PROPIA CELESTE VIOLETA</label>
            <input
              type="number"
              class="form-control"
              id="corte-cv-estimado"
              placeholder="Ej: 60"
              min="0"
            />
          </div>
          <div class="form-group">
            <label>OBSERVACIONES</label>
            <textarea
              class="form-control"
              id="corte-obs"
              placeholder="Sin inconvenientes..."
            ></textarea>
          </div>
          <button
            type="button"
            class="btn-submit"
            onclick="enviarCorteHorario()"
          >
            📤 Transmitir Reporte de Corte
          </button>
        </div>
      </div>

      <div id="view-computos" style="display: none">
        <div class="card">
          <h3 style="color: var(--primary); margin-bottom: 12px">
            📊 Consolidado Departamental Calamuchita
          </h3>

          <div style="margin-bottom: 16px">
            <div
              style="
                display: flex;
                justify-content: space-between;
                font-weight: 700;
              "
            >
              <span>🟣 Celeste Violeta</span><span id="res-cv-txt">0 (0%)</span>
            </div>
            <div
              style="
                background: #e2e8f0;
                height: 12px;
                border-radius: 10px;
                margin-top: 4px;
                overflow: hidden;
              "
            >
              <div
                id="res-cv-bar"
                style="background: var(--cv-purple); height: 100%; width: 0%"
              ></div>
            </div>
          </div>

          <h4 style="margin-top: 18px; margin-bottom: 6px; color: #334155">
            Participación y Estimación por Mesa
          </h4>
          <div style="overflow-x: auto">
            <table class="table-results">
              <thead>
                <tr>
                  <th>Mesa</th>
                  <th>Elect.</th>
                  <th>Votaron</th>
                  <th>% Part.</th>
                  <th>Est. CV</th>
                </tr>
              </thead>
              <tbody id="resumen-mesas-body"></tbody>
            </table>
          </div>
          <button
            class="btn-submit"
            style="margin-top: 20px; background: #64748b"
            onclick="sincronizarConNube()"
          >
            🔄 Sincronizar Estado con Google Sheet
          </button>
        </div>
      </div>
    </div>

    <script>
      const EMBEDDED_PADRON = [
        {
          orden: 1,
          nombre: "AGUILERA MARIA LAURA",
          dni: "29845792",
          mesa: 1,
          localidad: "La Cruz",
          voto: "NO",
          estimacion: "",
        },
        {
          orden: 2,
          nombre: "ALONSO SANTIAGO JULIAN",
          dni: "27120849",
          mesa: 1,
          localidad: "La Cruz",
          voto: "NO",
          estimacion: "",
        },
        {
          orden: 3,
          nombre: "ALVAREZ ANA BERTA",
          dni: "10437104",
          mesa: 1,
          localidad: "La Cruz",
          voto: "NO",
          estimacion: "",
        },
        {
          orden: 4,
          nombre: "ARIAS TERESA AMANDA",
          dni: "2625391",
          mesa: 1,
          localidad: "La Cruz",
          voto: "NO",
          estimacion: "",
        },
        {
          orden: 5,
          nombre: "BADELLINO SANDRA FANNY",
          dni: "17816864",
          mesa: 1,
          localidad: "La Cruz",
          voto: "NO",
          estimacion: "",
        },
        {
          orden: 6,
          nombre: "BOJANICH LILIANA MARGARITA",
          dni: "14354347",
          mesa: 1,
          localidad: "La Cruz",
          voto: "NO",
          estimacion: "",
        },
        {
          orden: 7,
          nombre: "BRINGAS LUCIA EVA",
          dni: "4781240",
          mesa: 1,
          localidad: "La Cruz",
          voto: "NO",
          estimacion: "",
        },
        {
          orden: 8,
          nombre: "BRINGAS MIRIA NELIDA",
          dni: "4781207",
          mesa: 1,
          localidad: "La Cruz",
          voto: "NO",
          estimacion: "",
        },
        {
          orden: 9,
          nombre: "BRINGAS PABLO ISAAC",
          dni: "21907312",
          mesa: 1,
          localidad: "La Cruz",
          voto: "NO",
          estimacion: "",
        },
        {
          orden: 10,
          nombre: "BUSSO GRICELDA MARY",
          dni: "20078644",
          mesa: 1,
          localidad: "La Cruz",
          voto: "NO",
          estimacion: "",
        },
      ]; // (Se incluyen los 920 en el build final)

      let padronData = [];
      let activeMesaFilter = "ALL";
      const GAS_URL =
        "https://script.google.com/macros/s/AKfycbxRNFMyPa1akVnKLBIm4HpgcNSDMcFYEEsqff4W7EiUF2O4WKcwN7V3v9DUX0Vtmy0F/exec";

      function initApp() {
        const stored = localStorage.getItem("padron_calamuchita_2026_v4");
        padronData = stored ? JSON.parse(stored) : EMBEDDED_PADRON;

        renderPadronList();
        updateKPIs();
        sincronizarConNube(); // Trae el estado actual de Google Drive
      }

      function saveLocal() {
        localStorage.setItem(
          "padron_calamuchita_2026_v4",
          JSON.stringify(padronData),
        );
      }

      function renderPadronList() {
        const container = document.getElementById("voter-list-container");
        container.innerHTML = "";
        const query = document
          .getElementById("padron-search")
          .value.toLowerCase()
          .trim();

        const filtered = padronData.filter((v) => {
          const matchesMesa =
            activeMesaFilter === "ALL" || v.mesa === parseInt(activeMesaFilter);
          const matchesQuery =
            !query ||
            v.nombre.toLowerCase().includes(query) ||
            v.dni.includes(query) ||
            v.orden.toString() === query;
          return matchesMesa && matchesQuery;
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div style="text-align:center; padding: 20px; color:#94a3b8;">No se encontraron afiliados.</div>`;
          return;
        }

        filtered.slice(0, 100).forEach((v) => {
          const div = document.createElement("div");
          div.className = `voter-item ${v.voto === "SI" ? "voted" : ""}`;
          div.innerHTML = `
          <div class="voter-info">
            <div class="voter-name">${v.orden}. ${v.nombre}</div>
            <div class="voter-meta">DNI: ${v.dni} | Mesa ${v.mesa} (${v.localidad})</div>
          </div>
          <div class="voter-actions">
            <button class="btn-voto ${v.voto === "SI" ? "voto-si" : ""}" onclick="toggleVoto(${v.orden})">
              ${v.voto === "SI" ? "✓ VOTÓ" : "NO VOTÓ"}
            </button>
            <select class="estimacion-select" onchange="setEstimacion(${v.orden}, this.value)">
              <option value="" ${!v.estimacion ? "selected" : ""}>Estimado...</option>
              <option value="CV" ${v.estimacion === "CV" ? "selected" : ""}>🟣 Celeste V.</option>
              <option value="MC" ${v.estimacion === "MC" ? "selected" : ""}>🔴 Multicolor</option>
              <option value="AB" ${v.estimacion === "AB" ? "selected" : ""}>🔵 Azul y B.</option>
              <option value="BL" ${v.estimacion === "BL" ? "selected" : ""}>⚪ Blanco/Otro</option>
            </select>
          </div>
        `;
          container.appendChild(div);
        });
      }

      function toggleVoto(orden) {
        const v = padronData.find((item) => item.orden === orden);
        if (v) {
          v.voto = v.voto === "SI" ? "NO" : "SI";
          if (v.voto === "SI" && !v.estimacion) v.estimacion = "CV";
          saveLocal();
          syncWithGoogleSheet(v);
          renderPadronList();
          updateKPIs();
        }
      }

      function setEstimacion(orden, val) {
        const v = padronData.find((item) => item.orden === orden);
        if (v) {
          v.estimacion = val;
          saveLocal();
          syncWithGoogleSheet(v);
          updateKPIs();
        }
      }

      function filterPadron() {
        renderPadronList();
      }

      function setMesaFilter(mesa, btn) {
        activeMesaFilter = mesa;
        document
          .querySelectorAll(".filter-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderPadronList();
      }

      function updateKPIs() {
        const total = padronData.length;
        const votaron = padronData.filter((v) => v.voto === "SI").length;
        const cv = padronData.filter(
          (v) => v.voto === "SI" && v.estimacion === "CV",
        ).length;

        document.getElementById("kpi-padron-total").innerText = total;
        document.getElementById("kpi-padron-votaron").innerText = votaron;
        document.getElementById("kpi-padron-cv").innerText = cv;

        const pctCV = votaron > 0 ? ((cv / votaron) * 100).toFixed(1) : 0;
        document.getElementById("res-cv-txt").innerText = `${cv} (${pctCV}%)`;
        document.getElementById("res-cv-bar").style.width = pctCV + "%";

        const tbody = document.getElementById("resumen-mesas-body");
        if (tbody) {
          tbody.innerHTML = "";
          const mesasCfg = [
            { num: 1, name: "Mesa 1 (La Cruz)", elect: 65 },
            { num: 2, name: "Mesa 2 (Embalse)", elect: 216 },
            { num: 3, name: "Mesa 3 (Santa Rosa)", elect: 578 },
            { num: 4, name: "Mesa 4 (San Agustín)", elect: 61 },
          ];

          let totElec = 0,
            totVot = 0,
            totCvEst = 0;
          mesasCfg.forEach((m) => {
            const mVot = padronData.filter(
              (v) => v.mesa === m.num && v.voto === "SI",
            ).length;
            const mCv = padronData.filter(
              (v) =>
                v.mesa === m.num && v.voto === "SI" && v.estimacion === "CV",
            ).length;
            const mPct = ((mVot / m.elect) * 100).toFixed(1);
            totElec += m.elect;
            totVot += mVot;
            totCvEst += mCv;

            tbody.innerHTML += `<tr><td><b>${m.name}</b></td><td>${m.elect}</td><td style="color:#16a34a; font-weight:700;">${mVot}</td><td>${mPct}%</td><td style="color:var(--cv-purple); font-weight:700;">${mCv}</td></tr>`;
          });
          tbody.innerHTML += `<tr><td><b>TOTAL</b></td><td><b>${totElec}</b></td><td style="color:#16a34a;"><b>${totVot}</b></td><td><b>${((totVot / totElec) * 100).toFixed(1)}%</b></td><td style="color:var(--cv-purple);"><b>${totCvEst}</b></td></tr>`;
        }
      }

      function showTab(tab) {
        document.getElementById("view-padron").style.display =
          tab === "padron" ? "block" : "none";
        document.getElementById("view-cortes").style.display =
          tab === "cortes" ? "block" : "none";
        document.getElementById("view-computos").style.display =
          tab === "computos" ? "block" : "none";
        document
          .getElementById("tab-padron")
          .classList.toggle("active", tab === "padron");
        document
          .getElementById("tab-cortes")
          .classList.toggle("active", tab === "cortes");
        document
          .getElementById("tab-computos")
          .classList.toggle("active", tab === "computos");
      }

      function syncWithGoogleSheet(voter) {
        document.getElementById("sync-msg").innerText = "🟡 Sincronizando...";
        const url = `${GAS_URL}?action=updateVoto&dni=${voter.dni}&voto=${voter.voto}&estimacion=${encodeURIComponent(voter.estimacion)}`;
        const s = document.createElement("script");
        s.src = url;
        s.onload = () => {
          document.getElementById("sync-msg").innerText = "🟢 Conectado";
          s.remove();
        };
        s.onerror = () => {
          document.getElementById("sync-msg").innerText = "🟡 Local";
        };
        document.body.appendChild(s);
      }

      function sincronizarConNube() {
        document.getElementById("sync-msg").innerText = "🟡 Actualizando...";
        fetch(`${GAS_URL}?action=getStatus`)
          .then((res) => res.json())
          .then((res) => {
            if (res.status === "success" && res.data) {
              padronData.forEach((v) => {
                if (res.data[v.dni]) {
                  v.voto = res.data[v.dni].voto;
                  v.estimacion = res.data[v.dni].estimacion;
                }
              });
              saveLocal();
              renderPadronList();
              updateKPIs();
              document.getElementById("sync-msg").innerText = "🟢 Sincronizado";
            }
          })
          .catch((err) => {
            document.getElementById("sync-msg").innerText = "🟢 Local OK";
          });
      }

      function enviarCorteHorario() {
        const mesa = document.getElementById("corte-mesa").value;
        const tipo = document.getElementById("corte-tipo").value;
        const tot = document.getElementById("corte-total-votaron").value;
        const cv = document.getElementById("corte-cv-estimado").value;
        const obs = document.getElementById("corte-obs").value;

        if (!tot) {
          alert("Ingresá la cantidad de votantes.");
          return;
        }
        const url = `${GAS_URL}?action=sendCorte&mesa=${mesa}&tipoCorte=${encodeURIComponent(tipo)}&totalVotaron=${tot}&cv=${cv || 0}&obs=${encodeURIComponent(obs)}`;
        const s = document.createElement("script");
        s.src = url;
        document.body.appendChild(s);
        alert(`¡Corte de las ${tipo} enviado a la nube!`);
      }

      window.onload = initApp;
    </script>
  </body>
</html>
